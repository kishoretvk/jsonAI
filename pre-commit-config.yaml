repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        args: [--line-length=79]
        exclude: ^(tests/|examples/)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: [--max-line-length=79, --extend-ignore=E203, --per-file-ignores=tests/*:W292,E501 examples/*:W292,E501]
  - repo: https://github.com/PyCQA/pylint
    rev: 3.2.7
    hooks:
      - id: pylint
        args: [--max-line-length=79, --disable=C0114,C0115,C0116]
        exclude: ^(tests/|examples/)